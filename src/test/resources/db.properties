# DataSource per i TEST — valori fissi, nessun placeholder ${DB_*}.
#
# Perché qui e non in application-local.yml: DataSourceConfig legge le property con
# @PropertySource("classpath:db.properties"), e su classpath test-classes precede
# classes, quindi questo file sostituisce quello di src/main/resources. Contenendo
# solo chiavi db.* non oscura nient'altro, mentre un application-local.yml nei test
# rimpiazzerebbe l'intero file principale (app.base-url, app.storage.*, app.jwt.*…)
# facendo fallire l'avvio del context.
#
# Valori fissi = i test restano sul DB locale anche con il .env della root che punta
# al database remoto (spring-dotenv non entra in gioco: non ci sono placeholder).
db.url=jdbc:postgresql://localhost:5432/sostitutoincloud
db.username=sostitutoincloud
db.password=postgres
db.driver-class-name=org.postgresql.Driver
db.pool.maximum-pool-size=5
db.pool.minimum-idle=1
