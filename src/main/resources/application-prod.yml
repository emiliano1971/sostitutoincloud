server:
  port: 8443
  servlet:
    context-path: /sostitutoincloud

spring:
  mail:
    host: localhost
    port: 25
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  base-url: https://prodpms.siv.cloud.it:8443/sostitutoincloud
  mail:
    # Frontend e backend sono sulla stessa origine: coincide con app.base-url.
    reset-link-base-url: https://prodpms.siv.cloud.it:8443/sostitutoincloud
  cors:
    allowed-origins: https://prodpms.siv.cloud.it:8443
  security:
    admin-password: ${ADMIN_PASSWORD:CHANGE_ME}
  jwt:
    # Nessun default: senza APP_JWT_SECRET il context non parte, invece di ripiegare
    # su un segreto committato e quindi noto a chiunque legga il repository.
    # Va impostata come variabile d'ambiente nel setenv.sh di Tomcat (o nelle env
    # variables di Coolify per il deploy Docker): il .env della root non viene letto.
    # Generazione: openssl rand -base64 48  — minimo 32 byte, richiesti da HS256.
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
