server:
  port: 8443
  servlet:
    # In prod il WAR è deployato su Tomcat standalone come ROOT.war: il context
    # path lo decide Tomcat dal nome del WAR, questa property vale solo per il
    # Tomcat embedded (mvn spring-boot:run). Tenuta allineata per coerenza.
    context-path: /

spring:
  mail:
    host: gaviatech-it.mail.protection.outlook.com
    port: 25
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  base-url: https://app.sostitutoincloud.it
  mail:
    from: sostitutoincloud@gaviatech.it
    # Frontend e backend sono sulla stessa origine: coincide con app.base-url.
    reset-link-base-url: https://app.sostitutoincloud.it
  cors:
    # Solo schema://host[:porta] — un Origin non contiene mai un path.
    allowed-origins: https://app.sostitutoincloud.it
  security:
    admin-password: ${ADMIN_PASSWORD:CHANGE_ME}
  jwt:
    # Nessun default: senza APP_JWT_SECRET il context non parte, invece di ripiegare
    # su un segreto committato e quindi noto a chiunque legga il repository.
    # Va impostata come variabile d'ambiente nel setenv.sh di Tomcat (o nelle env
    # variables di Coolify per il deploy Docker): il .env della root non viene letto.
    # Generazione: openssl rand -base64 48  — minimo 32 byte, richiesti da HS256.
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
