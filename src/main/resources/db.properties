# DataSource — file unico.
# I valori sono risolti a runtime da Spring: prima dal .env (spring-dotenv) / variabili
# d'ambiente, poi dai default qui sotto (${VAR:default}).
# NB: i default riflettono il setup locale di sviluppo così l'app parte anche senza .env.
db.url=${DB_URL:jdbc:postgresql://localhost:5432/sostitutoincloud}
db.username=${DB_USERNAME:sostitutoincloud}
db.password=${DB_PASSWORD:postgres}
db.driver-class-name=org.postgresql.Driver
db.pool.maximum-pool-size=10
db.pool.minimum-idle=2
